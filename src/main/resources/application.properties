spring.application.name=cafe-de-barrio
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cafe_barrio_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
server.error.include-message=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:}
